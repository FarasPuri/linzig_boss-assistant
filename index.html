# linzig_boss-assistant
Linzig - A Jarvis-style voice assistant web application for mobile devices, powered by Gemini AI and Web Speech API.
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Mobile</title>
    <style>
        :root {
            --glow-color: #00f3ff;
            --bg-color: #080f1d;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Sci-fi Hologram Arc Reactor UI */
        .reactor-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .outer-ring {
            width: 180px;
            height: 180px;
            border-top-color: var(--glow-color);
            border-bottom-color: var(--glow-color);
            animation: rotate 4s linear infinite;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        .inner-ring {
            width: 130px;
            height: 130px;
            border-left-color: var(--glow-color);
            border-right-color: var(--glow-color);
            animation: rotate-reverse 2.5s linear infinite;
        }

        .core {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(0,243,255,1) 0%, rgba(0,80,150,1) 70%);
            border-radius: 50%;
            box-shadow: 0 0 30px var(--glow-color);
            transition: all 0.3s ease;
        }

        /* Visualizer State when listening */
        .listening .outer-ring {
            animation: rotate 1s linear infinite;
            border-color: var(--glow-color);
            box-shadow: 0 0 40px var(--glow-color);
        }
        
        .listening .core {
            transform: scale(1.1);
            background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(0,243,255,1) 70%);
        }

        /* Status & Text Display */
        .status {
            margin-top: 30px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #8ab4f8;
            height: 20px;
        }

        .console-box {
            width: 85%;
            max-width: 400px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #c2e7ff;
        }

        .api-input {
            margin-top: 20px;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            border-radius: 4px;
            width: 75%;
            max-width: 300px;
            text-align: center;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="status" id="status-text">SYSTEM ONLINE - TAP REACTOR</div>

    <div class="reactor-container" id="reactor-btn">
        <div class="circle outer-ring"></div>
        <div class="circle inner-ring"></div>
        <div class="core"></div>
    </div>

    <div class="console-box" id="console-out">
        [System]: Standing by, sir.
    </div>

    <input type="password" id="api-key" class="api-input" placeholder="Paste Gemini API Key Here">

    <script>
        // --- Configuration & Elements ---
        const reactorBtn = document.getElementById('reactor-btn');
        const statusText = document.getElementById('status-text');
        const consoleOut = document.getElementById('console-out');
        const apiKeyInput = document.getElementById('api-key');

        // Load saved API key if available
        if(localStorage.getItem('gemini_key')) {
            apiKeyInput.value = localStorage.getItem('gemini_key');
        }

        // --- Web Speech API Setup ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stops when user stops talking
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                reactorBtn.classList.add('listening');
                statusText.innerText = "LISTENING...";
            };

            recognition.onend = () => {
                isListening = false;
                reactorBtn.classList.remove('listening');
                if(statusText.innerText === "LISTENING...") {
                    statusText.innerText = "PROCESSING...";
                }
            };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                printConsole("You", transcript);
                
                const apiKey = apiKeyInput.value.trim();
                if(!apiKey) {
                    updateStatus("ERROR: API KEY MISSING");
                    speak("Please provide an API key, sir.");
                    return;
                }
                localStorage.setItem('gemini_key', apiKey); // Save for convenience

                await askGemini(transcript, apiKey);
            };

            recognition.onerror = (event) => {
                console.error(event);
                updateStatus("ERROR DETECTED");
                printConsole("System Error", event.error);
            };

        } else {
            statusText.innerText = "SPEECH NOT SUPPORTED";
            alert("Your browser does not support Speech Recognition. Please try Chrome or Safari.");
        }

        // --- Trigger Recognition ---
        reactorBtn.addEventListener('click', () => {
            if (!recognition) return;
            
            // Stop any ongoing speech synthesis if user taps to talk
            window.speechSynthesis.cancel();

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // --- Gemini AI Integration ---
        async function askGemini(prompt, apiKey) {
            updateStatus("THINKING...");
            // Instruction tells the AI to behave like Jarvis
            const systemInstruction = "You are JARVIS, the concise, witty, and highly intelligent AI assistant to Tony Stark. Keep your answers brief, helpful, and tailored for audio responses. Address the user as 'sir' or 'ma'am' appropriately.";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                
                printConsole("JARVIS", reply);
                updateStatus("SPEAKING...");
                speak(reply);

            } catch (error) {
                printConsole("System", "Failed to connect to core neural network.");
                updateStatus("CONNECTION ERROR");
            }
        }

        // --- Text to Speech (Output) ---
        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Find a nice British/Robotic voice if possible
            const voices = window.speechSynthesis.getVoices();
            const jarvisVoice = voices.find(voice => voice.name.includes('Google UK English Male') || voice.lang === 'en-GB');
            if (jarvisVoice) utterance.voice = jarvisVoice;
            
            utterance.rate = 1.05; // Slightly faster for that snappy crisp feeling
            utterance.pitch = 0.9; // Slightly lower pitch for sophistication

            utterance.onend = () => {
                updateStatus("SYSTEM ONLINE - READY");
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- Helper Utilities ---
        function printConsole(sender, text) {
            consoleOut.innerHTML += `<br><strong>[${sender}]:</strong> ${text}`;
            consoleOut.scrollTop = consoleOut.scrollHeight;
        }

        function updateStatus(text) {
            statusText.innerText = text;
        }

        // Fix for voice loading quirks in mobile browsers
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
